<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISSEO – Rapport d'Intervention</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; font-size: 11px; color: #222; background: white; padding: 16px; max-width: 210mm; margin: 0 auto; }

/* HEADER */
.hdr { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 3px solid #EA7807; padding-bottom: 10px; margin-bottom: 12px; }
.logo { font-weight: 900; font-size: 28px; letter-spacing: 4px; color: #4A4A4A; }
.logo span { color: #EA7807; }
.logo-sub { font-size: 8px; letter-spacing: 2px; text-transform: uppercase; color: #999; }
.logo-contact { font-size: 9px; color: #666; margin-top: 3px; line-height: 1.6; }
.ri-num { text-align: right; }
.ri-num-lbl { font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: #999; }
.ri-num-val { font-size: 22px; font-weight: 900; color: #EA7807; font-family: monospace; }
.ri-date { font-size: 10px; color: #666; }

/* SECTIONS */
.section { margin-bottom: 10px; border: 1px solid #ddd; border-radius: 4px; overflow: hidden; }
.section-title { background: #f5f4f0; padding: 5px 10px; font-weight: bold; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #4A4A4A; border-bottom: 1px solid #ddd; display: flex; align-items: center; gap: 6px; }
.section-title .bar { width: 4px; height: 14px; border-radius: 2px; background: #EA7807; }
.section-title .bar.teal { background: #3AB6AD; }
.section-body { padding: 8px 10px; }

/* GRIDS */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.grid4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 8px; }

/* FIELD */
.field { display: flex; flex-direction: column; gap: 2px; }
.field.full { grid-column: 1/-1; }
.field label { font-size: 8px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; color: #999; }
.field .val { border-bottom: 1px solid #ccc; padding: 3px 2px; min-height: 20px; font-size: 11px; color: #222; }
.field .val.big { min-height: 40px; }

/* TYPE BADGE */
.type-badge { display: inline-block; padding: 3px 12px; border-radius: 4px; font-weight: bold; font-size: 11px; background: #EA7807; color: white; }

/* PIÈCES */
.pieces-table { width: 100%; border-collapse: collapse; font-size: 10px; margin-top: 4px; }
.pieces-table th { background: #f5f4f0; padding: 5px 6px; text-align: left; font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: #666; border-bottom: 2px solid #ddd; }
.pieces-table th.r { text-align: right; }
.pieces-table td { padding: 5px 6px; border-bottom: 1px solid #f0f0f0; }
.pieces-table td.r { text-align: right; }
.prov { display: inline-block; font-size: 8px; font-weight: bold; padding: 1px 5px; border-radius: 3px; }
.prov-SAV { background: rgba(234,120,7,.1); color: #EA7807; }
.prov-VEH { background: rgba(8,145,178,.1); color: #0891B2; }
.prov-ATL { background: rgba(58,182,173,.1); color: #3AB6AD; }
.prov-CMD { background: rgba(124,58,237,.1); color: #7C3AED; }

/* TOTAUX */
.totaux { margin-top: 8px; border: 1px solid #ddd; border-radius: 4px; overflow: hidden; }
.tot-line { display: flex; justify-content: space-between; padding: 5px 10px; border-bottom: 1px solid #f0f0f0; font-size: 11px; }
.tot-line:last-child { background: #4A4A4A; color: white; border: none; font-weight: bold; font-size: 13px; }
.tot-line .lbl { color: #666; font-size: 10px; }
.tot-line:last-child .lbl { color: rgba(255,255,255,.7); font-size: 10px; }
.tot-line .val { font-weight: bold; color: #4A4A4A; }
.tot-line:last-child .val { color: #EA7807; font-size: 16px; }

/* HEURES */
.heures-boxes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 8px; }
.h-box { border: 1px solid #ddd; border-radius: 4px; padding: 6px; text-align: center; }
.h-box .h-lbl { font-size: 8px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; color: #999; display: block; margin-bottom: 2px; }
.h-box .h-val { font-size: 16px; font-weight: 900; color: #4A4A4A; }
.h-box.teal .h-val { color: #3AB6AD; }

/* SIGNATURE */
.sig-notice { font-size: 10px; color: #666; font-style: italic; padding: 8px 10px; background: #f9f9f8; border-left: 3px solid #EA7807; margin-bottom: 10px; line-height: 1.5; }
.sig-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.sig-box { border: 1px solid #ddd; border-radius: 4px; overflow: hidden; }
.sig-box-hd { background: #f5f4f0; padding: 5px 8px; font-size: 9px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; color: #666; border-bottom: 1px solid #ddd; }
.sig-area { height: 70px; background: white; position: relative; }
.sig-area img { width: 100%; height: 100%; object-fit: contain; }
.sig-name { font-size: 9px; color: #666; padding: 4px 8px; border-top: 1px solid #f0f0f0; }

/* PHOTOS */
.photos-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 6px; }
.photo-item img { width: 100%; border-radius: 4px; border: 1px solid #ddd; }
.photo-cap { font-size: 9px; color: #666; text-align: center; margin-top: 2px; }

/* FOOTER */
.doc-footer { margin-top: 12px; padding-top: 8px; border-top: 2px solid #EA7807; text-align: center; font-size: 9px; color: #888; line-height: 1.8; }

/* CGV PAGE 2 */
.page-break { page-break-before: always; padding-top: 16px; }
.cgv-title { font-size: 13px; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; color: #4A4A4A; border-bottom: 2px solid #EA7807; padding-bottom: 6px; margin-bottom: 12px; }
.cgv-art { margin-bottom: 10px; }
.cgv-art h3 { font-size: 10px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; color: #4A4A4A; margin-bottom: 4px; border-bottom: 1px solid #ddd; padding-bottom: 2px; }
.cgv-art p, .cgv-art li { font-size: 10px; line-height: 1.65; color: #444; margin-bottom: 3px; }
.cgv-art ul { margin-left: 14px; }

/* PRINT */
@media print {
  body { padding: 8mm; }
  .no-print { display: none !important; }
}

/* SCREEN ACTIONS */
.print-actions { position: fixed; bottom: 16px; right: 16px; display: flex; gap: 8px; z-index: 100; }
.btn-print { padding: 12px 20px; border-radius: 8px; border: none; background: #EA7807; color: white; font-weight: bold; font-size: 14px; cursor: pointer; box-shadow: 0 3px 12px rgba(0,0,0,.2); }
.btn-close { padding: 12px 16px; border-radius: 8px; border: none; background: #4A4A4A; color: white; font-weight: bold; font-size: 14px; cursor: pointer; }
</style>
</head>
<body>

<div class="print-actions no-print">
  <button class="btn-close" onclick="window.close()">✕ Fermer</button>
  <button class="btn-print" onclick="window.print()">🖨 Enregistrer PDF</button>
</div>

<div id="rapport-content">
  <!-- Contenu généré par JS -->
</div>

<script>
// Récupérer les données depuis localStorage
const dataStr = localStorage.getItem('isseo_print_data');
if (!dataStr) {
  document.getElementById('rapport-content').innerHTML = '<p style="color:red;padding:20px">Aucune donnée à imprimer. Retournez au rapport et appuyez sur 🖨 PDF.</p>';
} else {
  const d = JSON.parse(dataStr);
  renderRapport(d);
}

function fmt(n) {
  if (!n && n !== 0) return '—';
  return parseFloat(n).toLocaleString('fr-FR', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' €';
}

function val(v) { return v || '—'; }

function renderRapport(d) {
  const prixMode = d.prix_mode || 'show-all';
  const showDetail = prixMode === 'show-all';
  const showTotal = prixMode !== 'hide-all';

  // Pièces HTML
  let piecesHTML = '';
  if (d.pieces && d.pieces.length) {
    piecesHTML = `<table class="pieces-table">
      <thead><tr>
        <th>Référence</th><th>Désignation</th><th class="r">Qté</th>
        ${showDetail ? '<th class="r">PU HT</th><th class="r">Total HT</th>' : ''}
        <th>Provenance</th>
      </tr></thead><tbody>`;
    d.pieces.forEach(p => {
      const tot = (parseFloat(p.qte)||0) * (parseFloat(p.pu)||0);
      piecesHTML += `<tr>
        <td>${val(p.ref)}</td>
        <td>${val(p.designation)}</td>
        <td class="r">${val(p.qte)}</td>
        ${showDetail ? `<td class="r">${fmt(p.pu)}</td><td class="r">${fmt(tot)}</td>` : ''}
        <td><span class="prov prov-${p.provenance||'SAV'}">${p.provenance||'SAV'}</span></td>
      </tr>`;
    });
    piecesHTML += '</tbody></table>';
  } else {
    piecesHTML = '<p style="color:#999;font-style:italic;font-size:10px;padding:4px 0">Aucune pièce</p>';
  }

  // Totaux HTML
  let totauxHTML = '';
  if (showTotal) {
    totauxHTML = `<div class="totaux">`;
    if (showDetail) {
      totauxHTML += `
        <div class="tot-line"><span class="lbl">Pièces HT</span><span class="val">${fmt(d.totaux?.ht - (d.pointage?.tps_inter||0)*(d.pointage?.taux_mo||75) - (d.pointage?.dep_facture=='1'?d.pointage?.forfait_dep||0:0))}</span></div>
        <div class="tot-line"><span class="lbl">Main d'œuvre HT</span><span class="val">${fmt((d.pointage?.tps_inter||0)*(d.pointage?.taux_mo||75))}</span></div>
        <div class="tot-line"><span class="lbl">Déplacement HT</span><span class="val">${fmt(d.pointage?.dep_facture=='1'?d.pointage?.forfait_dep||0:0)}</span></div>
        <div class="tot-line"><span class="lbl">Total HT</span><span class="val">${fmt(d.totaux?.ht)}</span></div>
        <div class="tot-line"><span class="lbl">TVA 20%</span><span class="val">${fmt((d.totaux?.ht||0)*0.20)}</span></div>`;
    }
    totauxHTML += `<div class="tot-line"><span class="lbl">Total TTC</span><span class="val">${fmt(d.totaux?.ttc)}</span></div></div>`;
  }

  // Photos HTML
  let photosHTML = '';
  if (d.photos_data && d.photos_data.length) {
    photosHTML = `<div class="section">
      <div class="section-title"><div class="bar teal"></div>Photos Pièces Défectueuses</div>
      <div class="section-body">
        <div class="photos-grid">
          ${d.photos_data.map(p => `<div class="photo-item"><img src="${p.data}"><div class="photo-cap">${p.caption||''}</div></div>`).join('')}
        </div>
      </div>
    </div>`;
  }

  // Signatures HTML
  const sig1 = d.sig_client ? `<img src="${d.sig_client}">` : '';
  const sig2 = d.sig_isseo ? `<img src="${d.sig_isseo}">` : '';

  const html = `
    <!-- EN-TÊTE -->
    <div class="hdr">
      <div>
        <div class="logo">ISS<span>É</span>O</div>
        <div class="logo-sub">Chariots Élévateurs · Vente Location Maintenance</div>
        <div class="logo-contact">20 Allée Marie Curie – ZA Lavalduc – 13270 Fos-sur-Mer<br>Tél : 06 07 08 69 58 · 04 42 06 70 14 · contact@isseochariot.fr</div>
      </div>
      <div class="ri-num">
        <div class="ri-num-lbl">Avis d'intervention N°</div>
        <div class="ri-num-val">${val(d.numero)}</div>
        <div class="ri-date">${val(d.date)}</div>
        <div style="margin-top:4px"><span class="type-badge">${val(d.type)}</span></div>
      </div>
    </div>

    <!-- IDENTIFICATION -->
    <div class="section">
      <div class="section-title"><div class="bar"></div>Identification</div>
      <div class="section-body grid2">
        <div class="field"><label>Client</label><div class="val">${val(d.client)}</div></div>
        <div class="field"><label>Technicien ISSEO</label><div class="val">${val(d.technicien)}</div></div>
        <div class="field full"><label>Site d'intervention</label><div class="val">${val(d.site)}</div></div>
        ${d.num_contrat ? `<div class="field"><label>N° Contrat</label><div class="val">${d.num_contrat}</div></div>` : ''}
        ${d.cmd_client ? `<div class="field"><label>N° Commande</label><div class="val">${d.cmd_client}</div></div>` : ''}
      </div>
    </div>

    <!-- MATÉRIEL -->
    <div class="section">
      <div class="section-title"><div class="bar teal"></div>Matériel</div>
      <div class="section-body grid4">
        <div class="field"><label>Type / Modèle</label><div class="val">${val(d.materiel?.type)}</div></div>
        <div class="field"><label>N° de Série</label><div class="val">${val(d.materiel?.serie)}</div></div>
        <div class="field"><label>N° Parc</label><div class="val">${val(d.materiel?.interne)}</div></div>
        <div class="field"><label>Horamètre</label><div class="val">${val(d.materiel?.horametre)} h</div></div>
      </div>
    </div>

    <!-- DIAGNOSTIC & TRAVAUX -->
    <div class="section">
      <div class="section-title"><div class="bar"></div>Diagnostic & Travaux</div>
      <div class="section-body">
        <div class="field" style="margin-bottom:8px"><label>Objet / Diagnostic</label><div class="val big">${val(d.objet)}</div></div>
        <div class="field" style="margin-bottom:8px"><label>Travaux réalisés</label><div class="val big">${val(d.travaux)}</div></div>
        ${d.a_prevoir ? `<div class="field"><label>Travaux à prévoir</label><div class="val">${d.a_prevoir}</div></div>` : ''}
      </div>
    </div>

    <!-- PHOTOS -->
    ${photosHTML}

    <!-- PIÈCES -->
    <div class="section">
      <div class="section-title"><div class="bar teal"></div>Fournitures & Pièces</div>
      <div class="section-body">
        ${piecesHTML}
        ${totauxHTML}
      </div>
    </div>

    <!-- TEMPS -->
    <div class="section">
      <div class="section-title"><div class="bar"></div>Temps & Déplacement</div>
      <div class="section-body">
        <div class="heures-boxes">
          <div class="h-box"><span class="h-lbl">Départ</span><span class="h-val">${val(d.temps?.depart)}</span></div>
          <div class="h-box"><span class="h-lbl">Fin</span><span class="h-val">${val(d.temps?.fin)}</span></div>
          <div class="h-box teal"><span class="h-lbl">Durée</span><span class="h-val">${d.pointage?.tps_inter ? Math.floor(d.pointage.tps_inter)+'h'+String(Math.round((d.pointage.tps_inter%1)*60)).padStart(2,'0') : '—'}</span></div>
          <div class="h-box"><span class="h-lbl">Km</span><span class="h-val">${val(d.temps?.km)}</span></div>
        </div>
        ${d.remarques ? `<div class="field"><label>Remarques</label><div class="val">${d.remarques}</div></div>` : ''}
      </div>
    </div>

    <!-- SIGNATURE -->
    <div class="section">
      <div class="section-title"><div class="bar teal"></div>Validation & Signatures</div>
      <div class="section-body">
        <div class="sig-notice">Les travaux ont été exécutés conformément à la demande du client, qui confirme leur bonne exécution. Par sa signature, le client accepte sans réserve les conditions générales d'intervention ISSEO figurant au dos du présent document.</div>
        <div class="sig-grid">
          <div class="sig-box">
            <div class="sig-box-hd">Signature Client</div>
            <div class="sig-area">${sig1}</div>
            <div class="sig-name">${val(d.signataire?.nom)} — ${val(d.signataire?.fonction)}</div>
          </div>
          <div class="sig-box">
            <div class="sig-box-hd">Responsable ISSEO</div>
            <div class="sig-area">${sig2}</div>
            <div class="sig-name">ISSEO Chariots Élévateurs</div>
          </div>
        </div>
      </div>
    </div>

    <div class="doc-footer">
      <strong>ISSEO CHARIOTS ÉLÉVATEURS</strong> – SASU au capital de 3 000 € – SIRET 911 977 809 00019 – APE 3312Z – TVA FR36 911 977 809<br>
      20 Allée Marie Curie – ZA Lavalduc – 13270 Fos-sur-Mer &nbsp;|&nbsp; 37d chemin de Margaillan – 13200 Arles
    </div>

    <!-- CGV PAGE 2 -->
    <div class="page-break">
      <div class="cgv-title">Conditions Générales d'Intervention — ISSEO Chariots Élévateurs</div>
      <div class="cgv-art"><h3>I – Formation du contrat</h3><p>Toute commande implique l'acceptation pleine et entière des présentes conditions. En cas de dépannage, le contrat est réputé conclu du seul fait du déplacement du technicien ISSEO sur site.</p></div>
      <div class="cgv-art"><h3>II – Prix et conditions de paiement</h3><p>Les prix s'entendent nets hors taxes, selon le tarif en vigueur au jour de l'intervention. Les factures sont payables à <strong>30 jours date de facture</strong>, sauf accord express écrit préalable. Tout retard entraîne des pénalités au taux légal majoré de 7 points et une indemnité forfaitaire de <strong>40 €</strong>.</p></div>
      <div class="cgv-art"><h3>III – Tarification</h3><p><strong>Facturation par demi-heure, toute demi-heure entamée est due.</strong> Majorations : +50% après 18h en semaine · +100% samedi avant 18h · +150% samedi après 18h · +150% dimanche/fériés avant 18h · +200% dimanche/fériés après 18h.</p></div>
      <div class="cgv-art"><h3>IV – Devis et diagnostics</h3><p>Estimations gratuites sans démontage. Frais facturés si démontage nécessaire, même si devis non accepté.</p></div>
      <div class="cgv-art"><h3>V – Réserve de propriété</h3><p>Les pièces restent propriété d'ISSEO jusqu'au paiement intégral.</p></div>
      <div class="cgv-art"><h3>VI – Responsabilités</h3><p>Tout vice apparent doit être signalé par écrit dans les <strong>8 jours ouvrés</strong> suivant l'intervention.</p></div>
      <div class="cgv-art"><h3>VII – Juridiction</h3><p>Tout litige est soumis au <strong>Tribunal de Commerce de Tarascon</strong>.</p></div>
      <div class="doc-footer" style="margin-top:20px">
        <strong>ISSEO CHARIOTS ÉLÉVATEURS</strong> – SIRET 911 977 809 00019 – TVA FR36 911 977 809<br>
        20 Allée Marie Curie – 13270 Fos-sur-Mer | 37d chemin de Margaillan – 13200 Arles<br>
        📞 06 07 08 69 58 · 04 42 06 70 14 | contact@isseochariot.fr
      </div>
    </div>
  `;

  document.getElementById('rapport-content').innerHTML = html;
  document.title = 'ISSEO – ' + (d.numero||'RI');
}
</script>
</body>
</html>
